<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anvil</title>
    <style>
      :root {
        --bg-void: #0e1015;
        --bg-surface: #13161d;
        --bg-elevated: #191c24;
        --bg-hover: #212531;
        --border-subtle: #262b38;
        --border-strong: #353c4f;
        --text-primary: #f1f3f7;
        --text-secondary: #9aa4b8;
        --text-muted: #667085;
        --accent-copper: #e07a2f;
        --accent-copper-hover: #ec8a42;
        --accent-steel: #5b8def;
        --status-ok: #2ecc71;
        --status-warn: #f59e0b;
        --status-danger: #e63946;
        --mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: var(--bg-void);
        color: var(--text-primary);
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.45;
        overflow: hidden;
      }

      button,
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        border: 1px solid var(--border-subtle);
        background: var(--bg-elevated);
        border-radius: 7px;
        padding: 7px 12px;
        transition: background 0.14s ease, border-color 0.14s ease, opacity 0.14s ease;
      }

      button:hover:not(:disabled) {
        background: var(--bg-hover);
        border-color: var(--border-strong);
      }

      button:disabled {
        opacity: 0.48;
        cursor: not-allowed;
      }

      button.primary {
        background: var(--accent-copper);
        border-color: var(--accent-copper);
        color: #101218;
        font-weight: 600;
      }

      button.primary:hover:not(:disabled) {
        background: var(--accent-copper-hover);
        border-color: var(--accent-copper-hover);
      }

      button.danger {
        color: #ffb4ba;
        border-color: rgba(230, 57, 70, 0.45);
        background: rgba(230, 57, 70, 0.12);
      }

      button.danger:hover:not(:disabled) {
        background: rgba(230, 57, 70, 0.24);
      }

      button.ghost {
        background: transparent;
        border-color: transparent;
      }

      button.ghost:hover:not(:disabled) {
        background: var(--bg-hover);
        border-color: var(--border-subtle);
      }

      input,
      select,
      textarea {
        width: 100%;
        background: var(--bg-void);
        border: 1px solid var(--border-subtle);
        border-radius: 7px;
        padding: 8px 10px;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent-copper);
      }

      input[type="checkbox"] {
        width: auto;
        accent-color: var(--accent-copper);
      }

      .mono {
        font-family: var(--mono);
      }

      .app-root {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }

      .topbar {
        height: 52px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 14px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        letter-spacing: 0.01em;
        min-width: 170px;
      }

      .brand-tag {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(91, 141, 239, 0.16);
        color: var(--accent-steel);
        border: 1px solid rgba(91, 141, 239, 0.35);
      }

      .search-wrap {
        flex: 1;
        max-width: 420px;
        position: relative;
      }

      .search-wrap input {
        padding-right: 54px;
        background: var(--bg-void);
      }

      .kbd-hint {
        position: absolute;
        right: 9px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 11px;
        color: var(--text-muted);
        border: 1px solid var(--border-subtle);
        border-radius: 4px;
        padding: 1px 5px;
        pointer-events: none;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .error-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 14px;
        background: rgba(230, 57, 70, 0.14);
        border-bottom: 1px solid rgba(230, 57, 70, 0.38);
        color: #ff9ba3;
        font-size: 12.5px;
        flex-shrink: 0;
      }

      .unlock-screen {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow-y: auto;
        background: radial-gradient(circle at top, rgba(224, 122, 47, 0.08), transparent 46%),
          var(--bg-surface);
      }

      .unlock-card {
        width: 100%;
        max-width: 410px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 26px;
      }

      .unlock-head {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .unlock-head h1 {
        margin: 10px 0 4px;
        font-size: 20px;
      }

      .unlock-head p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 12.5px;
      }

      .tabs {
        display: flex;
        gap: 4px;
        margin: 18px 0 16px;
        padding: 4px;
        background: var(--bg-void);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
      }

      .tabs button {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 12.5px;
        padding: 6px 8px;
      }

      .tabs button.active {
        background: var(--bg-elevated);
        color: var(--text-primary);
        border: 1px solid var(--border-subtle);
        font-weight: 600;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-label {
        display: block;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 5px;
      }

      .workspace {
        flex: 1;
        display: grid;
        grid-template-columns: 230px 300px 1fr;
        min-height: 0;
      }

      .sidebar {
        background: var(--bg-surface);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        padding: 12px;
        overflow-y: auto;
      }

      .nav-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin: 14px 6px 6px;
      }

      .nav-btn {
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-secondary);
        margin-bottom: 2px;
      }

      .nav-btn:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
        border-color: transparent;
      }

      .nav-btn.active {
        background: rgba(224, 122, 47, 0.14);
        border-color: rgba(224, 122, 47, 0.36);
        color: var(--text-primary);
        font-weight: 500;
      }

      .folder-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .folder-del {
        padding: 4px 7px;
        font-size: 11px;
        color: var(--text-muted);
        opacity: 0.65;
      }

      .folder-del:hover {
        opacity: 1;
        color: #ff9ba3;
      }

      .sidebar-footer {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--border-subtle);
        font-size: 12px;
        color: var(--text-secondary);
      }

      .list-pane {
        background: var(--bg-void);
        border-right: 1px solid var(--border-subtle);
        overflow-y: auto;
        padding: 8px;
      }

      .item-row {
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        margin-bottom: 4px;
      }

      .item-row:hover {
        background: var(--bg-surface);
        border-color: var(--border-subtle);
      }

      .item-row.active {
        background: var(--bg-elevated);
        border-color: var(--accent-copper);
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 12px;
        color: #fff;
        flex-shrink: 0;
        overflow: hidden;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .item-meta {
        min-width: 0;
        flex: 1;
      }

      .item-title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-sub {
        font-size: 12px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pill {
        font-size: 10.5px;
        padding: 1px 6px;
        border-radius: 999px;
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
      }

      .pill.totp {
        border-color: rgba(91, 141, 239, 0.45);
        color: var(--accent-steel);
      }

      .detail-pane {
        background: var(--bg-surface);
        overflow-y: auto;
        padding: 22px 26px;
      }

      .detail-card {
        max-width: 720px;
        margin: 0 auto;
      }

      .detail-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-subtle);
        margin-bottom: 18px;
      }

      .detail-identity {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .detail-identity .avatar {
        width: 48px;
        height: 48px;
        font-size: 16px;
      }

      .detail-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .field-box {
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        border-radius: 9px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }

      .field-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .field-name {
        font-size: 11.5px;
        color: var(--text-secondary);
        margin-bottom: 4px;
      }

      .field-value {
        font-size: 14px;
        word-break: break-all;
      }

      .totp-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 9px;
        background: rgba(91, 141, 239, 0.08);
        border: 1px solid rgba(91, 141, 239, 0.35);
        margin-bottom: 12px;
      }

      .totp-code {
        font-family: var(--mono);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--text-primary);
      }

      .totp-ring-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .strength-track {
        height: 5px;
        width: 100%;
        border-radius: 999px;
        background: var(--bg-void);
        overflow: hidden;
        margin-top: 8px;
      }

      .strength-fill {
        height: 100%;
        transition: width 0.2s ease;
      }

      .row-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .empty-state {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        text-align: center;
        padding: 32px;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(6, 8, 12, 0.74);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 40;
      }

      .modal {
        width: 100%;
        max-width: 560px;
        max-height: 88vh;
        overflow-y: auto;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        padding: 20px;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .modal-header h2 {
        margin: 0;
        font-size: 16.5px;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        min-width: 250px;
        background: var(--bg-elevated);
        border: 1px solid var(--accent-copper);
        border-radius: 9px;
        padding: 10px 14px;
        z-index: 50;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .sub-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-root"></div>
    <script>
      (() => {
        "use strict";

        const BRIDGE_TOKEN = __ANVIL_BOOTSTRAP_TOKEN__;
        const DEFAULT_SERVER_URL = __ANVIL_DEFAULT_SERVER_URL__;

        const IMPORT_FORMATS = [
          ["bitwarden_json", "Bitwarden JSON (non chiffré)"],
          ["bitwarden_encrypted_json", "Bitwarden JSON (chiffré)"],
          ["bitwarden_csv", "Bitwarden CSV"],
          ["chrome_csv", "Chrome CSV"],
          ["edge_csv", "Edge CSV"],
          ["brave_csv", "Brave CSV"],
          ["firefox_csv", "Firefox CSV"],
          ["keepass_csv", "KeePass / KeePassXC CSV"],
          ["keepass_xml", "KeePass / KeePassXC XML"],
          ["one_password_csv", "1Password CSV"],
          ["one_password_1pux", "1Password (.1pux)"],
          ["proton_pass_csv", "Proton Pass CSV"],
          ["dashlane_csv", "Dashlane CSV"],
        ];

        const state = {
          status: {
            configured: false,
            authenticated: false,
            unlocked: false,
            biometric_available: false,
            biometric_enabled: false,
            server_url: null,
            email: null,
            sync_revision: 0,
            pending_conflicts: 0,
          },
          authMode: "login",
          authServerUrl: DEFAULT_SERVER_URL || "http://127.0.0.1:8080",
          authEmail: "",
          authInvite: "",
          busy: false,
          syncing: false,
          error: null,
          navFilter: { kind: "all", folderId: null },
          searchQuery: "",
          folders: [],
          items: [],
          selectedItemId: null,
          selectedItem: null,
          selectedStrength: null,
          revealPassword: false,
          editing: false,
          editForm: null,
          totp: null,
          showAddFolder: false,
          showBiometricPrompt: false,
          modal: null,
          importPreview: null,
          conflicts: [],
          toast: null,
          genResult: null,
          genOpts: {
            mode: "random",
            length: 20,
            uppercase: true,
            lowercase: true,
            digits: true,
            symbols: true,
            exclude_ambiguous: true,
            word_count: 5,
            separator: "-",
            capitalize: true,
            include_number: true,
          },
        };

        async function ipc(command, payload = {}) {
          const response = await fetch("/api/desktop-ipc", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-anvil-bridge-token": BRIDGE_TOKEN,
            },
            body: JSON.stringify({ command, payload }),
          });
          let env;
          try {
            env = await response.json();
          } catch {
            throw new Error(`Réponse IPC invalide (HTTP ${response.status})`);
          }
          if (!response.ok || !env.ok) {
            throw new Error(env.error || `Erreur IPC (HTTP ${response.status})`);
          }
          return env.data;
        }

        function el(tag, attrs = {}, children = []) {
          const node = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs)) {
            if (v === undefined || v === null || v === false) continue;
            if (k === "class") node.className = v;
            else if (k === "text") node.textContent = String(v);
            else if (k === "value") node.value = String(v);
            else if (k === "checked") node.checked = Boolean(v);
            else if (k === "disabled") node.disabled = Boolean(v);
            else if (k.startsWith("on") && typeof v === "function") {
              node.addEventListener(k.slice(2).toLowerCase(), v);
            } else if (k === "style" && typeof v === "object") {
              Object.assign(node.style, v);
            } else {
              node.setAttribute(k, String(v));
            }
          }
          for (const child of Array.isArray(children) ? children : [children]) {
            if (child === null || child === undefined || child === false) continue;
            node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
          }
          return node;
        }

        function makeLogoSvg(size = 24) {
          const ns = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(ns, "svg");
          svg.setAttribute("viewBox", "0 0 64 64");
          svg.setAttribute("width", String(size));
          svg.setAttribute("height", String(size));
          svg.setAttribute("fill", "none");

          const p1 = document.createElementNS(ns, "path");
          p1.setAttribute("d", "M22 6H42L54 16V35L32 58L10 35V16L22 6Z");
          p1.setAttribute("fill", "#191C24");
          p1.setAttribute("stroke", "#2E3444");
          p1.setAttribute("stroke-width", "2.5");
          svg.appendChild(p1);

          const p2 = document.createElementNS(ns, "path");
          p2.setAttribute("d", "M14 25.5H47.5V27.6H41.5L37.5 31V38.2L43.5 43V46H20.5V43L26.5 38.2V31L21.5 27.8L14 25.5Z");
          p2.setAttribute("fill", "#F1F3F7");
          svg.appendChild(p2);

          const p3 = document.createElementNS(ns, "path");
          p3.setAttribute("d", "M13.5 22.5H48V26H14.5L13.5 22.5Z");
          p3.setAttribute("fill", "#E07A2F");
          svg.appendChild(p3);
          return svg;
        }

        function strengthStyle(score) {
          if (score <= 1) return { pct: 25, color: "var(--status-danger)", label: "Faible" };
          if (score === 2) return { pct: 50, color: "var(--status-warn)", label: "Moyen" };
          if (score === 3) return { pct: 75, color: "var(--accent-steel)", label: "Bon" };
          return { pct: 100, color: "var(--status-ok)", label: "Robuste" };
        }

        function formatTotpCode(code) {
          if (!code) return "";
          if (code.length === 6) return `${code.slice(0, 3)} ${code.slice(3)}`;
          if (code.length === 8) return `${code.slice(0, 4)} ${code.slice(4)}`;
          return code;
        }

        function startToastCountdown() {
          setInterval(() => {
            if (!state.toast) return;
            const rem = Math.max(0, Math.ceil((state.toast.expires_at_ms - Date.now()) / 1000));
            const toastEl = document.getElementById("clipboard-toast-sec");
            if (rem <= 0) {
              state.toast = null;
              render();
            } else if (toastEl) {
              toastEl.textContent = `${rem} s`;
            }
          }, 500);
        }

        async function refreshTotpNow() {
          const item = state.selectedItem;
          if (!state.status.unlocked || state.editing || !item || !item.login || !item.login.totp) {
            state.totp = null;
            return;
          }
          try {
            const nowSec = Math.floor(Date.now() / 1000);
            state.totp = await ipc("cmd_generate_totp", {
              secretOrUri: item.login.totp.secret_base32,
              unixTimestampSeconds: nowSec,
            });
            const codeEl = document.getElementById("live-totp-code");
            const secEl = document.getElementById("live-totp-sec");
            if (codeEl && secEl && state.totp) {
              codeEl.textContent = formatTotpCode(state.totp.code);
              secEl.textContent = `${state.totp.remaining_seconds} s`;
            }
          } catch {
            state.totp = null;
          }
        }

        function startTotpLoop() {
          setInterval(() => {
            if (state.status.unlocked && !state.editing && state.selectedItem?.login?.totp) {
              void refreshTotpNow();
            }
          }, 1000);
        }

        async function runSafe(fn) {
          state.busy = true;
          state.error = null;
          render();
          try {
            await fn();
          } catch (err) {
            state.error = err instanceof Error ? err.message : String(err);
          } finally {
            state.busy = false;
            render();
          }
        }

        async function refreshAll(preferredItemId = null) {
          state.status = await ipc("cmd_status");
          if (!state.status.unlocked) {
            state.folders = [];
            state.items = [];
            state.selectedItemId = null;
            state.selectedItem = null;
            state.selectedStrength = null;
            state.totp = null;
            state.editing = false;
            if (state.status.configured && state.authMode !== "register") {
              state.authMode = "unlock";
            } else if (!state.status.configured && state.authMode === "unlock") {
              state.authMode = "register";
            }
            if (state.status.server_url) state.authServerUrl = state.status.server_url;
            if (state.status.email) state.authEmail = state.status.email;
            return;
          }

          state.folders = await ipc("cmd_list_folders");
          state.items = await ipc("cmd_list_items", {
            query: state.searchQuery,
            folderId: state.navFilter.kind === "folder" ? state.navFilter.folderId : null,
            favoritesOnly: state.navFilter.kind === "favorites",
            trashedOnly: state.navFilter.kind === "trash",
          });
          if (state.navFilter.kind === "totp") {
            state.items = state.items.filter((i) => i.has_totp);
          }

          if (state.status.pending_conflicts > 0) {
            state.conflicts = await ipc("cmd_list_conflicts");
          } else {
            state.conflicts = [];
          }

          const targetId = preferredItemId || state.selectedItemId;
          if (targetId && state.items.some((i) => i.id === targetId)) {
            await selectItem(targetId, false);
          } else if (state.items.length > 0) {
            await selectItem(state.items[0].id, false);
          } else {
            state.selectedItemId = null;
            state.selectedItem = null;
            state.selectedStrength = null;
            state.totp = null;
          }
        }

        async function selectItem(id, rerender = true) {
          state.selectedItemId = id;
          state.revealPassword = false;
          state.editing = false;
          state.selectedItem = await ipc("cmd_get_item", { id });
          const pw = state.selectedItem?.login?.password || "";
          state.selectedStrength = pw ? await ipc("cmd_evaluate_password", { value: pw }) : null;
          await refreshTotpNow();
          if (rerender) render();
        }

        async function copySecret(label, value) {
          if (!value) return;
          state.toast = await ipc("cmd_copy_secret", { label, value });
          render();
        }

            title: isNew ? "" : item.title,

            favorite: isNew ? false : Boolean(item.favorite),

          const importBox = el("div", { class: "field-box" }, [

            el("div", { class: "form-group" }, [el("label", { class: "form-label", text: "Mot de passe du fichier (optionnel)" }), backupPwInput]),
            el("button", {
              type: "button",

              text: "Analyser avant import (Dry-Run)",
              onClick: async () => {
                const file = fileInput.files?.[0];
                if (!file) {
                  state.error = "Sélectionnez d'abord un fichier à importer.";
                  render();
                  return;
                }
                const bytes = Array.from(new Uint8Array(await file.arrayBuffer()));
                await runSafe(async () => {
                  state.importPreview = await ipc("cmd_preview_import", {
                    format: fmtSel.value,
                    bytes,

                  });

          if (state.importPreview) {

            const polSel = el("select", {}, [
              el("option", { value: "skip", text: "Ignorer les doublons" }),

            importBox.appendChild(

                  type: "button",
                  class: "primary",
                  text: "Confirmer l'import",
                  onClick: () =>
                    void runSafe(async () => {
                      const rep = await ipc("cmd_execute_import", { previewId: p.preview_id, policy: polSel.value });
                      state.importPreview = null;
                      state.modal = null;
                      state.error = null;
                      await refreshAll();
                      state.toast = {
                        label: `Import terminé : ${rep.created} créées, ${rep.merged} fusionnées`,
                        clear_after_seconds: 8,
                        expires_at_ms: Date.now() + 8000,
                      };
                    }),
                }),
              ]),
            );
          }

          modal.appendChild(importBox);

          const expFmt = el("select", {}, [
            el("option", { value: "anvil", text: "Archive chiffrée (.anvil)" }),
            el("option", { value: "bitwarden_json", text: "Bitwarden JSON (clair)" }),
            el("option", { value: "csv", text: "CSV standard (clair)" }),
          ]);
          const expMasterPw = el("input", { type: "password", placeholder: "Master Password requis" });
          const expArchivePw = el("input", { type: "password", placeholder: "Mot de passe archive (.anvil)" });

          modal.appendChild(
            el("div", { class: "field-box" }, [
              el("h3", { style: { margin: "0 0 10px", fontSize: "14px" }, text: "Exporter le coffre" }),

              el("div", { class: "form-group" }, [el("label", { class: "form-label", text: "Confirmation Master Password" }), expMasterPw]),
              el("div", { class: "form-group" }, [el("label", { class: "form-label", text: "Mot de passe archive (pour .anvil)" }), expArchivePw]),
              el("button", {
                type: "button",
                text: "Télécharger l'export",
                onClick: () =>
                  void runSafe(async () => {
                    const bytes = await ipc("cmd_export_vault", {
                      format: expFmt.value,
                      masterPassword: expMasterPw.value,
                      backupPassword: expArchivePw.value || null,
                    });
                    expMasterPw.value = "";
                    const ext = expFmt.value === "anvil" ? "anvil" : expFmt.value === "csv" ? "csv" : "json";
                    const blob = new Blob([new Uint8Array(bytes)], { type: "application/octet-stream" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `anvil-vault.${ext}`;
                    a.click();
                    URL.revokeObjectURL(url);
                  }),
              }),
            ]),
          );

          return el("div", { class: "modal-backdrop" }, [modal]);
        }

        function render() {
          const root = document.getElementById("app");
          if (!root) return;
          const activeEl = document.activeElement;
          const wasSearchFocused = activeEl && activeEl.id === "global-search";
          const searchSelStart = wasSearchFocused ? activeEl.selectionStart : null;
          root.replaceChildren();

          const searchInput = el("input", {
            id: "global-search",
            type: "search",
            value: state.searchQuery,
            placeholder: "Rechercher dans le coffre...",
            disabled: !state.status.unlocked,
            onInput: (e) => {
              state.searchQuery = e.target.value;
              if (state.status.unlocked) {
                void refreshAll().then(render);
              }
            },
          });

          const topbar = el("header", { class: "topbar" }, [
            el("div", { class: "brand" }, [
              makeLogoSvg(24),
              el("span", { text: "Anvil" }),
              el("span", { class: "brand-tag", text: "Zero-Knowledge" }),
            ]),
            state.status.unlocked
              ? el("div", { class: "search-wrap" }, [searchInput, el("span", { class: "kbd-hint", text: "Ctrl+K" })])
              : el("div", { style: { flex: 1 } }),
            state.status.unlocked
              ? el("div", { class: "topbar-actions" }, [
                  el("button", {
                    type: "button",
                    class: "primary",
                    text: "+ Nouvelle fiche",
                    onClick: () => beginEdit(null),
                  }),
                  el("button", {
                    type: "button",
                    text: "Générateur",
                    onClick: () => {
                      state.modal = "generator";
                      void generatePreview();
                    },
                  }),
                  el("button", {
                    type: "button",
                    text: "Import / Export",
                    onClick: () => {
                      state.modal = "import";
                      render();
                    },
                  }),
                  state.status.pending_conflicts > 0
                    ? el("button", {
                        type: "button",
                        class: "danger",
                        text: `Conflits (${state.status.pending_conflicts})`,
                        onClick: () => {
                          state.modal = "conflicts";
                          render();
                        },
                      })
                    : null,
                  el("button", {
                    type: "button",
                    disabled: state.syncing || state.busy,
                    text: state.syncing ? "Synchro..." : `Synchroniser (r${state.status.sync_revision})`,
                    onClick: () =>
                      void runSafe(async () => {
                        state.syncing = true;
                        render();
                        try {
                          await ipc("cmd_sync");
                          await refreshAll();
                        } finally {
                          state.syncing = false;
                        }
                      }),
                  }),
                  el("button", {
                    type: "button",
                    text: "Verrouiller",
                    onClick: () =>
                      void runSafe(async () => {
                        await ipc("cmd_lock");
                        await refreshAll();
                      }),
                  }),
                ])
              : null,
          ]);
          root.appendChild(topbar);

          if (state.error) {
            root.appendChild(
              el("div", { class: "error-banner" }, [
                el("span", { text: state.error }),
                el("button", {
                  type: "button",
                  class: "ghost",
                  text: "Fermer",
                  onClick: () => {
                    state.error = null;
                    render();
                  },
                }),
              ]),
            );
          }

          root.appendChild(state.status.unlocked ? renderWorkspace() : renderUnlockScreen());

          if (state.modal === "generator") root.appendChild(renderGeneratorModal());
          if (state.modal === "import") root.appendChild(renderImportExportModal());
          if (state.modal === "conflicts") root.appendChild(renderConflictsModal());

          if (state.toast) {
            const rem = Math.max(0, Math.ceil((state.toast.expires_at_ms - Date.now()) / 1000));
            root.appendChild(
              el("div", { class: "toast" }, [
                el("div", { class: "field-row" }, [
                  el("span", { style: { fontWeight: 600 }, text: `${state.toast.label} copié` }),
                  el("span", { id: "clipboard-toast-sec", class: "mono", style: { color: "var(--accent-copper)" }, text: `${rem} s` }),
                ]),
                el("div", { style: { fontSize: "11.5px", color: "var(--text-secondary)", marginTop: "3px" }, text: "Nettoyage automatique du presse-papiers actif." }),
              ]),
            );
          }

          if (wasSearchFocused) {
            const restored = document.getElementById("global-search");
            if (restored) {
              restored.focus();
              if (typeof searchSelStart === "number") {
                restored.setSelectionRange(searchSelStart, searchSelStart);
              }
            }
          }
        }

        window.addEventListener("keydown", (e) => {
          if (e.ctrlKey && e.key.toLowerCase() === "k") {
            e.preventDefault();
            document.getElementById("global-search")?.focus();
          } else if (e.ctrlKey && e.key.toLowerCase() === "n" && state.status.unlocked) {
            e.preventDefault();
            beginEdit(null);
          } else if (e.ctrlKey && e.key.toLowerCase() === "l" && state.status.unlocked) {
            e.preventDefault();
            void runSafe(async () => {
              await ipc("cmd_lock");
              await refreshAll();
            });
          } else if (e.key === "Escape") {
            if (state.modal) {
              state.modal = null;
              render();
            } else if (state.editing) {
              state.editing = false;
              render();
            }
          }
        });

        startToastCountdown();
        startTotpLoop();
        void runSafe(refreshAll);
      })();
    </script>
  </body>
</html>
