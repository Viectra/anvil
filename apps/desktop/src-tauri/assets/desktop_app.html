<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anvil</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-titlebar: #121215;
        --bg-canvas: #1b1b1f;
        --bg-void: #141418;
        --bg-surface: #202025;
        --bg-elevated: #2b2b31;
        --bg-modal: #111114;
        --bg-hover: #32323a;
        --border-subtle: #2e2e36;
        --border-strong: #42424d;
        --text-primary: #f4f4f7;
        --text-secondary: #a4a4b2;
        --text-muted: #70707e;
        --accent: #7c6dfa;
        --accent-hover: #8d80ff;
        --accent-muted: rgba(124, 109, 250, 0.16);
        --accent-border: rgba(124, 109, 250, 0.42);
        --light-surface: #dcdce2;
        --light-surface-hover: #eaeaf0;
        --light-text: #16161a;
        --light-placeholder: #62626d;
        --status-ok: #2fb379;
        --status-warn: #e5a93c;
        --status-danger: #e54858;
        --accent-blue: #4e86f5;
        --mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
        --sans: "Segoe UI Variable", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.45;
        overflow: hidden;
        user-select: none;
      }

      .selectable {
        user-select: text;
      }

      button,
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        border: 1px solid var(--border-subtle);
        background: var(--bg-elevated);
        border-radius: 7px;
        padding: 7px 12px;
        transition: background 0.14s ease, border-color 0.14s ease, opacity 0.14s ease, transform 0.08s ease;
      }

      button:hover:not(:disabled) {
        background: var(--bg-hover);
        border-color: var(--border-strong);
      }

      button:disabled {
        opacity: 0.48;
        cursor: not-allowed;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
        font-weight: 600;
      }

      button.primary:hover:not(:disabled) {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      button.light {
        background: var(--light-surface);
        border-color: transparent;
        color: var(--light-text);
        font-weight: 600;
      }

      button.light:hover:not(:disabled) {
        background: var(--light-surface-hover);
        border-color: transparent;
      }

      button.danger {
        color: #ffb6bd;
        border-color: rgba(229, 72, 88, 0.45);
        background: rgba(229, 72, 88, 0.14);
      }

      button.danger:hover:not(:disabled) {
        background: rgba(229, 72, 88, 0.25);
      }

      button.ghost {
        background: transparent;
        border-color: transparent;
      }

      button.ghost:hover:not(:disabled) {
        background: var(--bg-hover);
        border-color: var(--border-subtle);
      }

      button.link-btn {
        background: transparent;
        border: none;
        padding: 0;
        color: var(--accent);
        font-weight: 600;
      }

      button.link-btn:hover:not(:disabled) {
        background: transparent;
        color: var(--accent-hover);
        text-decoration: underline;
      }

      input,
      select,
      textarea {
        width: 100%;
        background: var(--bg-void);
        border: 1px solid var(--border-subtle);
        border-radius: 7px;
        padding: 9px 11px;
        outline: none;
        user-select: text;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
      }

      input[type="checkbox"] {
        width: auto;
        accent-color: var(--accent);
      }

      .mono {
        font-family: var(--mono);
      }

      .app-root {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        background: var(--bg-canvas);
        border: 1px solid #26262e;
      }

      /* Invisible border resize handles for frameless window */
      .resize-edge {
        position: fixed;
        z-index: 120;
      }
      .resize-n { top: 0; left: 6px; right: 6px; height: 4px; cursor: n-resize; }
      .resize-s { bottom: 0; left: 6px; right: 6px; height: 4px; cursor: s-resize; }
      .resize-e { top: 6px; bottom: 6px; right: 0; width: 4px; cursor: e-resize; }
      .resize-w { top: 6px; bottom: 6px; left: 0; width: 4px; cursor: w-resize; }
      .resize-nw { top: 0; left: 0; width: 8px; height: 8px; cursor: nw-resize; }
      .resize-ne { top: 0; right: 0; width: 8px; height: 8px; cursor: ne-resize; }
      .resize-sw { bottom: 0; left: 0; width: 8px; height: 8px; cursor: sw-resize; }
      .resize-se { bottom: 0; right: 0; width: 8px; height: 8px; cursor: se-resize; }

      /* Custom Frameless Titlebar */
      .titlebar {
        height: 44px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--bg-titlebar);
        border-bottom: 1px solid #24242b;
        padding-left: 14px;
      }

      .titlebar-brand {
        display: flex;
        align-items: center;
        gap: 11px;
        pointer-events: none;
      }

      .titlebar-brand-name {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }

      .titlebar-drag {
        flex: 1;
        height: 100%;
        display: flex;
        align-items: center;
      }

      .win-controls {
        display: flex;
        align-items: stretch;
        height: 100%;
      }

      .win-btn {
        width: 46px;
        height: 44px;
        border: none;
        border-radius: 0;
        background: transparent;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      .win-btn:hover:not(:disabled) {
        background: #272730;
        border-color: transparent;
        color: var(--text-primary);
      }

      .win-btn.close:hover:not(:disabled) {
        background: #e54858;
        color: #ffffff;
      }

      /* Secondary Workspace Toolbar */
      .workspace-bar {
        height: 48px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 14px;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
      }

      .search-wrap {
        flex: 1;
        max-width: 390px;
        position: relative;
      }

      .search-wrap input {
        padding: 7px 56px 7px 11px;
        background: var(--bg-void);
      }

      .kbd-hint {
        position: absolute;
        right: 9px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 10.5px;
        font-family: var(--mono);
        color: var(--text-muted);
        border: 1px solid var(--border-subtle);
        border-radius: 4px;
        padding: 1px 5px;
        pointer-events: none;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .error-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 16px;
        background: rgba(229, 72, 88, 0.16);
        border-bottom: 1px solid rgba(229, 72, 88, 0.42);
        color: #ffb2ba;
        font-size: 12.5px;
        flex-shrink: 0;
      }

      /* Auth Screens (Unlock / Login / SignIn) matching mockups */
      .auth-stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow-y: auto;
        background: radial-gradient(circle at 50% 15%, rgba(124, 109, 250, 0.08), transparent 52%),
          var(--bg-canvas);
      }

      .auth-card {
        width: 100%;
        max-width: 410px;
        background: var(--bg-elevated);
        border: 1px solid #35353e;
        border-radius: 14px;
        padding: 32px 30px 26px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
      }

      .auth-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 20px;
      }

      .auth-picture-box {
        width: 96px;
        height: 96px;
        border-radius: 10px;
        background: var(--light-surface);
        color: #35353f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 2px solid #3c3c47;
        margin-bottom: 14px;
      }

      .auth-picture-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .auth-email {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        word-break: break-all;
      }

      .auth-url {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 2px;
        word-break: break-all;
      }

      .auth-subtitle {
        margin: 0;
        font-size: 12.5px;
        color: var(--text-secondary);
      }

      .auth-section-title {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 10px;
      }

      .auth-field-wrap {
        position: relative;
        margin-bottom: 11px;
      }

      .auth-label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 5px;
      }

      .auth-input {
        width: 100%;
        background: var(--light-surface);
        color: var(--light-text);
        border: 2px solid transparent;
        border-radius: 7px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 500;
      }

      .auth-input::placeholder {
        color: var(--light-placeholder);
        opacity: 1;
      }

      .auth-input:focus {
        border-color: var(--accent);
        background: #e6e6ec;
      }

      .auth-inline-chip {
        position: absolute;
        right: 7px;
        top: 50%;
        transform: translateY(-50%);
        padding: 3px 7px;
        font-size: 10.5px;
        border-radius: 5px;
        background: rgba(22, 22, 26, 0.1);
        color: #3a3a46;
        border: 1px solid rgba(22, 22, 26, 0.16);
      }

      .auth-inline-chip:hover:not(:disabled) {
        background: rgba(124, 109, 250, 0.22);
        color: #16161a;
        border-color: var(--accent);
      }

      .auth-submit {
        width: 100%;
        padding: 10px 14px;
        font-size: 13.5px;
        margin-top: 4px;
      }

      .auth-or {
        text-align: center;
        font-size: 12px;
        color: var(--text-secondary);
        margin: 12px 0;
      }

      .auth-footer-link {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .role-badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .role-badge.admin {
        background: var(--accent-muted);
        color: #c2baff;
        border: 1px solid var(--accent-border);
      }

      .role-badge.user {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-secondary);
        border: 1px solid var(--border-strong);
      }

      /* Workspace 3-pane layout */
      .workspace {
        flex: 1;
        display: grid;
        grid-template-columns: 236px 305px 1fr;
        min-height: 0;
      }

      .sidebar {
        background: var(--bg-surface);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        padding: 12px;
        overflow-y: auto;
      }

      .nav-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin: 14px 6px 6px;
      }

      .nav-btn {
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 7px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-secondary);
        margin-bottom: 2px;
      }

      .nav-btn:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
        border-color: transparent;
      }

      .nav-btn.active {
        background: var(--accent-muted);
        border-color: var(--accent-border);
        color: var(--text-primary);
        font-weight: 600;
      }

      .folder-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .folder-del {
        padding: 4px 7px;
        font-size: 11px;
        color: var(--text-muted);
        opacity: 0.65;
      }

      .folder-del:hover {
        opacity: 1;
        color: #ff9ba3;
      }

      .sidebar-footer {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--border-subtle);
        font-size: 12px;
        color: var(--text-secondary);
      }

      .account-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: 9px;
        background: var(--bg-canvas);
        border: 1px solid var(--border-subtle);
        margin-bottom: 8px;
      }

      .account-chip-avatar {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
        font-weight: 700;
        color: var(--accent);
      }

      .account-chip-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .list-pane {
        background: var(--bg-canvas);
        border-right: 1px solid var(--border-subtle);
        overflow-y: auto;
        padding: 8px;
      }

      .item-row {
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        margin-bottom: 4px;
        cursor: pointer;
      }

      .item-row:hover {
        background: var(--bg-surface);
        border-color: var(--border-subtle);
      }

      .item-row.active {
        background: var(--bg-elevated);
        border-color: var(--accent);
      }

      .list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 4px 4px 8px;
        margin-bottom: 6px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .list-count {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .kind-pills {
        display: flex;
        gap: 4px;
      }

      .kind-pill {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 999px;
        background: transparent;
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
      }

      .kind-pill.active {
        background: var(--accent-muted);
        border-color: var(--accent-border);
        color: var(--text-primary);
      }

      .quick-copy-btn {
        font-size: 10.5px;
        padding: 2px 6px;
        border-radius: 5px;
        color: var(--text-secondary);
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 12px;
        color: #fff;
        flex-shrink: 0;
        overflow: hidden;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .item-meta {
        min-width: 0;
        flex: 1;
      }

      .item-title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-sub {
        font-size: 12px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pill {
        font-size: 10.5px;
        padding: 1px 6px;
        border-radius: 999px;
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
      }

      .pill.totp {
        border-color: rgba(78, 134, 245, 0.45);
        color: var(--accent-blue);
      }

      .detail-pane {
        background: var(--bg-surface);
        overflow-y: auto;
        padding: 22px 26px;
      }

      .detail-card {
        max-width: 720px;
        margin: 0 auto;
      }

      .detail-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-subtle);
        margin-bottom: 18px;
      }

      .detail-identity {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .detail-identity .avatar {
        width: 48px;
        height: 48px;
        font-size: 16px;
      }

      .detail-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .field-box {
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        border-radius: 9px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }

      .field-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .field-name {
        font-size: 11.5px;
        color: var(--text-secondary);
        margin-bottom: 4px;
      }

      .field-value {
        font-size: 14px;
        word-break: break-all;
      }

      .totp-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 9px;
        background: rgba(124, 109, 250, 0.09);
        border: 1px solid var(--accent-border);
        margin-bottom: 12px;
      }

      .totp-code {
        font-family: var(--mono);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--text-primary);
      }

      .totp-ring-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .strength-track {
        height: 5px;
        width: 100%;
        border-radius: 999px;
        background: var(--bg-void);
        overflow: hidden;
        margin-top: 8px;
      }

      .strength-fill {
        height: 100%;
        transition: width 0.2s ease;
      }

      .row-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .empty-state {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        text-align: center;
        padding: 32px;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(8, 8, 12, 0.72);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 80;
      }

      .modal {
        width: 100%;
        max-width: 560px;
        max-height: 88vh;
        overflow-y: auto;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        border-radius: 13px;
        padding: 22px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.6);
      }

      .confirm-modal {
        width: 100%;
        max-width: 360px;
        background: var(--bg-modal);
        border: 1px solid #2b2b34;
        border-radius: 14px;
        padding: 30px 26px 26px;
        text-align: center;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.72);
      }

      .confirm-bang {
        font-size: 32px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 12px;
        color: var(--text-primary);
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .modal-header h2 {
        margin: 0;
        font-size: 16.5px;
      }

      .tabs {
        display: flex;
        gap: 4px;
        margin: 0 0 14px;
        padding: 4px;
        background: var(--bg-void);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
      }

      .tabs button {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 12.5px;
        padding: 6px 8px;
      }

      .tabs button.active {
        background: var(--bg-elevated);
        color: var(--text-primary);
        border: 1px solid var(--border-subtle);
        font-weight: 600;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        min-width: 250px;
        background: var(--bg-elevated);
        border: 1px solid var(--accent);
        border-radius: 9px;
        padding: 10px 14px;
        z-index: 95;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-label {
        display: block;
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 5px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .sub-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-root"></div>
    <script>
      (() => {
        "use strict";

        const BRIDGE_TOKEN = __ANVIL_BOOTSTRAP_TOKEN__;
        const DEFAULT_SERVER_URL = __ANVIL_DEFAULT_SERVER_URL__;
        const MAX_AVATAR_BYTES = 5 * 1024 * 1024;

        const IMPORT_FORMATS = [
          ["bitwarden_json", "Bitwarden JSON (non chiffré)"],
          ["bitwarden_encrypted_json", "Bitwarden JSON (chiffré)"],
          ["bitwarden_csv", "Bitwarden CSV"],
          ["chrome_csv", "Chrome CSV"],
          ["edge_csv", "Edge CSV"],
          ["brave_csv", "Brave CSV"],
          ["firefox_csv", "Firefox CSV"],
          ["keepass_csv", "KeePass / KeePassXC CSV"],
          ["keepass_xml", "KeePass / KeePassXC XML"],
          ["one_password_csv", "1Password CSV"],
          ["one_password_1pux", "1Password (.1pux)"],
          ["proton_pass_csv", "Proton Pass CSV"],
          ["dashlane_csv", "Dashlane CSV"],
        ];

        const state = {
          status: {
            configured: false,
            authenticated: false,
            unlocked: false,
            biometric_available: false,
            biometric_enabled: false,
            server_url: null,
            email: null,
            role: null,
            avatar_data_url: null,
            sync_revision: 0,
            pending_conflicts: 0,
          },
          chrome: { is_maximized: false },
          authMode: "login",
          authServerUrl: "",
          authEmail: "",
          authInvite: "",
          showLogoutConfirm: false,
          busy: false,
          syncing: false,
          error: null,
          navFilter: { kind: "all", folderId: null },
          kindFilter: "all",
          searchQuery: "",
          folders: [],
          items: [],
          selectedItemId: null,
          selectedItem: null,
          selectedStrength: null,
          revealPassword: false,
          editing: false,
          editForm: null,
          totp: null,
          showAddFolder: false,
          modal: null,
          accountTab: "profile",
          importPreview: null,
          conflicts: [],
          toast: null,
          genResult: null,
          genOpts: {
            mode: "random",
            length: 20,
            uppercase: true,
            lowercase: true,
            digits: true,
            symbols: true,
            exclude_ambiguous: true,
            word_count: 5,
            separator: "-",
            capitalize: true,
            include_number: true,
          },
        };

        async function ipc(command, payload = {}) {
          const response = await fetch("/api/desktop-ipc", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-anvil-bridge-token": BRIDGE_TOKEN,
            },
            body: JSON.stringify({ command, payload }),
          });
          let env;
          try {
            env = await response.json();
          } catch {
            throw new Error(`Réponse IPC invalide (HTTP ${response.status})`);
          }
          if (!response.ok || !env.ok) {
            throw new Error(env.error || `Erreur IPC (HTTP ${response.status})`);
          }
          return env.data;
        }

        function el(tag, attrs = {}, children = []) {
          const node = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs)) {
            if (v === undefined || v === null || v === false) continue;
            if (k === "class") node.className = v;
            else if (k === "text") node.textContent = String(v);
            else if (k === "value") node.value = String(v);
            else if (k === "checked") node.checked = Boolean(v);
            else if (k === "disabled") node.disabled = Boolean(v);
            else if (k.startsWith("on") && typeof v === "function") {
              node.addEventListener(k.slice(2).toLowerCase(), v);
            } else if (k === "style" && typeof v === "object") {
              Object.assign(node.style, v);
            } else {
              node.setAttribute(k, String(v));
            }
          }
          for (const child of Array.isArray(children) ? children : [children]) {
            if (child === null || child === undefined || child === false) continue;
            node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
          }
          return node;
        }

        function makeSvg(viewBox, width, height, paths = []) {
          const ns = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(ns, "svg");
          svg.setAttribute("viewBox", viewBox);
          svg.setAttribute("width", String(width));
          svg.setAttribute("height", String(height));
          svg.setAttribute("fill", "none");
          for (const attrs of paths) {
            const shapeTag = attrs._tag || "path";
            const node = document.createElementNS(ns, shapeTag);
            for (const [k, v] of Object.entries(attrs)) {
              if (k === "_tag") continue;
              node.setAttribute(k, String(v));
            }
            svg.appendChild(node);
          }
          return svg;
        }

        function makeLogoSvg(size = 28) {
          return makeSvg("0 0 64 64", size, size, [
            {
              d: "M22 6H42L54 16V35L32 58L10 35V16L22 6Z",
              fill: "#232329",
              stroke: "#3C3C47",
              "stroke-width": "2.4",
            },
            {
              d: "M14 25.5H47.5V27.6H41.5L37.5 31V38.2L43.5 43V46H20.5V43L26.5 38.2V31L21.5 27.8L14 25.5Z",
              fill: "#F4F4F7",
            },
            {
              d: "M13.5 22.5H48V26H14.5L13.5 22.5Z",
              fill: "#7C6DFA",
            },
          ]);
        }

        function makeUserSilhouetteSvg(size = 44) {
          return makeSvg("0 0 24 24", size, size, [
            { _tag: "circle", cx: "12", cy: "8", r: "4", fill: "#525260" },
            { d: "M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5", fill: "#525260" },
          ]);
        }

        function roleBadgeEl(role) {
          const normalized = (role || "user").toLowerCase();
          const isAdmin = normalized === "admin";
          return el("span", {
            class: `role-badge ${isAdmin ? "admin" : "user"}`,
            text: isAdmin ? "Admin" : "User",
          });
        }

        function hasValidImageMagicBytes(bytes) {
          if (bytes.length < 12) return false;
          const isPng =
            bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47 &&
            bytes[4] === 0x0d && bytes[5] === 0x0a && bytes[6] === 0x1a && bytes[7] === 0x0a;
          const isJpeg = bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff;
          const isWebp =
            bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 &&
            bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50;
          return isPng || isJpeg || isWebp;
        }

        function showToast(label, durationSec = 5) {
          state.toast = {
            label,
            clear_after_seconds: durationSec,
            expires_at_ms: Date.now() + durationSec * 1000,
          };
        }

        function strengthStyle(score) {
          if (score <= 1) return { pct: 25, color: "var(--status-danger)", label: "Faible" };
          if (score === 2) return { pct: 50, color: "var(--status-warn)", label: "Moyen" };
          if (score === 3) return { pct: 75, color: "var(--accent-blue)", label: "Bon" };
          return { pct: 100, color: "var(--status-ok)", label: "Robuste" };
        }

        function formatTotpCode(code) {
          if (!code) return "";
          if (code.length === 6) return `${code.slice(0, 3)} ${code.slice(3)}`;
          if (code.length === 8) return `${code.slice(0, 4)} ${code.slice(4)}`;
          return code;
        }

        function startToastCountdown() {
          setInterval(() => {
            if (!state.toast) return;
            const rem = Math.max(0, Math.ceil((state.toast.expires_at_ms - Date.now()) / 1000));
            const toastEl = document.getElementById("clipboard-toast-sec");
            if (rem <= 0) {
              state.toast = null;
              render();
            } else if (toastEl) {
              toastEl.textContent = `${rem} s`;
            }
          }, 500);
        }

        async function refreshTotpNow() {
          const item = state.selectedItem;
          if (!state.status.unlocked || state.editing || !item || !item.login || !item.login.totp) {
            state.totp = null;
            return;
          }
          try {
            const nowSec = Math.floor(Date.now() / 1000);
            state.totp = await ipc("cmd_generate_totp", {
              secretOrUri: item.login.totp.secret_base32,
              unixTimestampSeconds: nowSec,
            });
            const codeEl = document.getElementById("live-totp-code");
            const secEl = document.getElementById("live-totp-sec");
            if (codeEl && secEl && state.totp) {
              codeEl.textContent = formatTotpCode(state.totp.code);
              secEl.textContent = `${state.totp.remaining_seconds} s`;
            }
          } catch {
            state.totp = null;
          }
        }

        function startTotpLoop() {
          setInterval(() => {
            if (state.status.unlocked && !state.editing && state.selectedItem?.login?.totp) {
              void refreshTotpNow();
            }
          }, 1000);
        }

        async function runSafe(fn) {
          state.busy = true;
          state.error = null;
          render();
          try {
            await fn();
          } catch (err) {
            state.error = err instanceof Error ? err.message : String(err);
          } finally {
            state.busy = false;
            render();
          }
        }

        async function refreshAll(preferredItemId = null) {
          state.status = await ipc("cmd_status");
          try {
            state.chrome = await ipc("cmd_window_chrome");
          } catch {
            // Keep cached state when chrome query unavailable.
          }

          if (!state.status.unlocked) {
            state.folders = [];
            state.items = [];
            state.selectedItemId = null;
            state.selectedItem = null;
            state.selectedStrength = null;
            state.totp = null;
            state.editing = false;
            state.modal = null;
            if (state.status.configured) {
              state.authMode = "unlock";
              if (state.status.server_url) state.authServerUrl = state.status.server_url;
              if (state.status.email) state.authEmail = state.status.email;
            } else {
              if (state.authMode === "unlock") state.authMode = "login";
            }
            return;
          }

          state.folders = await ipc("cmd_list_folders");
          state.items = await ipc("cmd_list_items", {
            query: state.searchQuery,
            folderId: state.navFilter.kind === "folder" ? state.navFilter.folderId : null,
            favoritesOnly: state.navFilter.kind === "favorites",
            trashedOnly: state.navFilter.kind === "trash",
          });
          if (state.navFilter.kind === "totp") {
            state.items = state.items.filter((i) => i.has_totp);
          }

          if (state.status.pending_conflicts > 0) {
            state.conflicts = await ipc("cmd_list_conflicts");
          } else {
            state.conflicts = [];
          }

          const targetId = preferredItemId || state.selectedItemId;
          if (targetId && state.items.some((i) => i.id === targetId)) {
            await selectItem(targetId, false);
          } else if (state.items.length > 0) {
            await selectItem(state.items[0].id, false);
          } else {
            state.selectedItemId = null;
            state.selectedItem = null;
            state.selectedStrength = null;
            state.totp = null;
          }
        }

        async function selectItem(id, rerender = true) {
          state.selectedItemId = id;
          state.revealPassword = false;
          state.editing = false;
          state.selectedItem = await ipc("cmd_get_item", { id });
          const pw = state.selectedItem?.login?.password || "";
          state.selectedStrength = pw ? await ipc("cmd_evaluate_password", { value: pw }) : null;
          await refreshTotpNow();
          if (rerender) render();
        }

        async function copySecret(label, value) {
          if (!value) return;
          state.toast = await ipc("cmd_copy_secret", { label, value });
          render();
        }

        function beginEdit(item) {
          const isNew = !item;
          state.editing = true;
          state.editForm = {
            id: isNew ? null : item.id,
            kind: isNew ? "login" : item.kind,
            title: isNew ? "" : item.title,
            folder_id: isNew
              ? state.navFilter.kind === "folder"
                ? state.navFilter.folderId || ""
                : ""
              : item.folder_id || "",
            favorite: isNew ? false : Boolean(item.favorite),
            trashed_at: isNew ? null : item.trashed_at,
            username: item?.login?.username || "",
            email: item?.login?.email || "",
            password: item?.login?.password || "",
            password_history: item?.login?.password_history || [],
            totp_secret: item?.login?.totp?.secret_base32 || "",
            totp_algorithm: item?.login?.totp?.algorithm || "SHA1",
            totp_digits: item?.login?.totp?.digits || 6,
            totp_period: item?.login?.totp?.period_seconds || 30,
            uris: item?.login?.uris?.length ? item.login.uris.map((u) => ({ ...u })) : [{ uri: "", match_mode: "base_domain" }],
            custom_fields: item?.custom_fields?.length ? item.custom_fields.map((c) => ({ ...c })) : [],
            notes: item?.notes || "",
          };
          render();
        }

        function attachWindowDragBehavior(dragZone) {
          let dragOrigin = null;
          let dragStarted = false;
          dragZone.addEventListener("mousedown", (e) => {
            if (e.button !== 0) return;
            dragOrigin = { x: e.clientX, y: e.clientY };
            dragStarted = false;
          });
          dragZone.addEventListener("mousemove", (e) => {
            if (!dragOrigin || dragStarted || (e.buttons & 1) === 0) return;
            const dx = Math.abs(e.clientX - dragOrigin.x);
            const dy = Math.abs(e.clientY - dragOrigin.y);
            if (dx > 3 || dy > 3) {
              dragStarted = true;
              dragOrigin = null;
              void ipc("cmd_window_drag").catch(() => {});
            }
          });
          window.addEventListener("mouseup", () => {
            dragOrigin = null;
            dragStarted = false;
          });
          dragZone.addEventListener("dblclick", () => {
            void ipc("cmd_window_toggle_maximize").then(() => refreshAll().then(render)).catch(() => {});
          });
        }

        function renderTitlebar() {
          const dragZone = el("div", { class: "titlebar-drag" });
          attachWindowDragBehavior(dragZone);

          const minBtn = el(
            "button",
            {
              type: "button",
              class: "win-btn",
              title: "Réduire",
              "aria-label": "Réduire",
              onClick: () => void ipc("cmd_window_minimize").catch(() => {}),
            },
            [makeSvg("0 0 12 12", 12, 12, [{ _tag: "line", x1: "1", y1: "6", x2: "11", y2: "6", stroke: "currentColor", "stroke-width": "1.3" }])],
          );

          const maxBtn = el(
            "button",
            {
              type: "button",
              class: "win-btn",
              title: state.chrome.is_maximized ? "Restaurer" : "Agrandir",
              "aria-label": state.chrome.is_maximized ? "Restaurer" : "Agrandir",
              onClick: () =>
                void ipc("cmd_window_toggle_maximize")
                  .then(() => refreshAll().then(render))
                  .catch(() => {}),
            },
            [
              state.chrome.is_maximized
                ? makeSvg("0 0 12 12", 12, 12, [
                    { _tag: "rect", x: "3", y: "1.5", width: "7.5", height: "7.5", stroke: "currentColor", "stroke-width": "1.2" },
                    { d: "M1.5 3.5V10.5H8.5", stroke: "currentColor", "stroke-width": "1.2" },
                  ])
                : makeSvg("0 0 12 12", 12, 12, [
                    { _tag: "rect", x: "1.8", y: "1.8", width: "8.4", height: "8.4", stroke: "currentColor", "stroke-width": "1.2" },
                  ]),
            ],
          );

          const closeBtn = el(
            "button",
            {
              type: "button",
              class: "win-btn close",
              title: "Fermer",
              "aria-label": "Fermer",
              onClick: () => void ipc("cmd_window_close").catch(() => {}),
            },
            [
              makeSvg("0 0 12 12", 12, 12, [
                { _tag: "line", x1: "2", y1: "2", x2: "10", y2: "10", stroke: "currentColor", "stroke-width": "1.35" },
                { _tag: "line", x1: "10", y1: "2", x2: "2", y2: "10", stroke: "currentColor", "stroke-width": "1.35" },
              ]),
            ],
          );

          return el("header", { class: "titlebar" }, [
            el("div", { class: "titlebar-brand" }, [
              makeLogoSvg(30),
              el("span", { class: "titlebar-brand-name", text: "Anvil" }),
            ]),
            dragZone,
            el("div", { class: "win-controls" }, [minBtn, maxBtn, closeBtn]),
          ]);
        }

        function appendResizeHandles(root) {
          if (state.chrome.is_maximized) return;
          const dirs = [
            ["north", "resize-n"],
            ["south", "resize-s"],
            ["east", "resize-e"],
            ["west", "resize-w"],
            ["north_west", "resize-nw"],
            ["north_east", "resize-ne"],
            ["south_west", "resize-sw"],
            ["south_east", "resize-se"],
          ];
          for (const [direction, cls] of dirs) {
            root.appendChild(
              el("div", {
                class: `resize-edge ${cls}`,
                onMousedown: (e) => {
                  if (e.button !== 0) return;
                  e.preventDefault();
                  void ipc("cmd_window_drag_resize", { direction }).catch(() => {});
                },
              }),
            );
          }
        }

        function renderLogoutConfirmModal() {
          const backdrop = el("div", {
            class: "modal-backdrop",
            onClick: (e) => {
              if (e.target === backdrop && !state.busy) {
                state.showLogoutConfirm = false;
                render();
              }
            },
          });

          const dialog = el("div", { class: "confirm-modal" }, [
            el("div", { class: "confirm-bang", text: "!" }),
            el("h2", { style: { margin: "0 0 8px", fontSize: "19px", fontWeight: 700 }, text: "Se Deconnecter" }),
            el("p", {
              style: { margin: "0 0 22px", fontSize: "12.5px", color: "var(--text-secondary)" },
              text: "Etes-Vous sur de vouloir vous deconnecter ?",
            }),
            el("button", {
              type: "button",
              class: "primary",
              style: { width: "100%", padding: "10px 14px", marginBottom: "10px" },
              disabled: state.busy,
              text: "Se Deconnecter",
              onClick: () =>
                void runSafe(async () => {
                  await ipc("cmd_logout");
                  state.showLogoutConfirm = false;
                  state.authMode = "login";
                  state.authEmail = "";
                  state.authInvite = "";
                  await refreshAll();
                }),
            }),
            el("button", {
              type: "button",
              class: "light",
              style: { width: "100%", padding: "10px 14px" },
              disabled: state.busy,
              text: "Annuler",
              onClick: () => {
                state.showLogoutConfirm = false;
                render();
              },
            }),
          ]);

          backdrop.appendChild(dialog);
          return backdrop;
        }

        function renderAuthScreens() {
          const card = el("div", { class: "auth-card" });

          if (state.status.configured && state.authMode === "unlock") {
            const picBox = el("div", { class: "auth-picture-box" });
            if (state.status.avatar_data_url) {
              picBox.appendChild(el("img", { src: state.status.avatar_data_url, alt: state.status.email || "Avatar" }));
            } else {
              picBox.appendChild(makeUserSilhouetteSvg(48));
            }

            card.appendChild(
              el("div", { class: "auth-hero" }, [
                picBox,
                el("div", { class: "auth-email", text: state.status.email || "-" }),
                el("div", { style: { marginTop: "6px", marginBottom: "4px" } }, [roleBadgeEl(state.status.role)]),
                el("div", { class: "auth-url", text: state.status.server_url || "" }),
              ]),
            );

            const pwInput = el("input", {
              type: "password",
              class: "auth-input",
              placeholder: "MasterPassword",
              autocomplete: "current-password",
              required: true,
            });

            const form = el("form", {
              onSubmit: (e) => {
                e.preventDefault();
                const pw = pwInput.value;
                pwInput.value = "";
                if (!pw) return;
                void runSafe(async () => {
                  await ipc("cmd_unlock_password", { masterPassword: pw });
                  await refreshAll();
                });
              },
            });

            form.appendChild(
              el("div", { class: "auth-field-wrap" }, [
                el("label", { class: "auth-label", text: "MasterPassword" }),
                pwInput,
              ]),
            );

            form.appendChild(
              el("button", {
                type: "submit",
                class: "primary auth-submit",
                disabled: state.busy,
                text: state.busy ? "Déverrouillage..." : "Unlock",
              }),
            );

            if (state.status.biometric_available && state.status.biometric_enabled) {
              form.appendChild(
                el("button", {
                  type: "button",
                  class: "ghost",
                  style: {
                    width: "100%",
                    marginTop: "9px",
                    borderColor: "var(--border-strong)",
                    background: "rgba(255,255,255,0.03)",
                    fontWeight: 500,
                  },
                  disabled: state.busy,
                  text: "Unlock with Windows Hello",
                  onClick: () =>
                    void runSafe(async () => {
                      await ipc("cmd_unlock_biometric");
                      await refreshAll();
                    }),
                }),
              );
            }

            card.appendChild(form);
            card.appendChild(el("div", { class: "auth-or", text: "or" }));
            card.appendChild(
              el("button", {
                type: "button",
                class: "light auth-submit",
                disabled: state.busy,
                text: "Login",
                onClick: () => {
                  state.showLogoutConfirm = true;
                  render();
                },
              }),
            );

            return el("div", { class: "auth-stage" }, [card]);
          }

          const isRegister = state.authMode === "register";

          const logoBox = el("div", {
            class: "auth-picture-box",
            style: { background: "#dcdce2", borderColor: "#464654" },
          }, [makeLogoSvg(58)]);

          card.appendChild(
            el("div", { class: "auth-hero" }, [
              logoBox,
              el("p", {
                class: "auth-subtitle",
                text: isRegister
                  ? "Créer un compte sur une instance Anvil"
                  : "Connexion à une instance Anvil",
              }),
            ]),
          );

          card.appendChild(el("div", { class: "auth-section-title", text: isRegister ? "SignIn" : "Login" }));

          const urlInput = el("input", {
            type: "url",
            class: "auth-input",
            value: state.authServerUrl,
            placeholder: "URL (ex: http://100.65.1.0:8080)",
            style: { paddingRight: DEFAULT_SERVER_URL ? "60px" : "12px" },
            required: true,
            onInput: (e) => {
              state.authServerUrl = e.target.value;
            },
          });

          const emailInput = el("input", {
            type: "email",
            class: "auth-input",
            value: state.authEmail,
            placeholder: "Email",
            required: true,
            onInput: (e) => {
              state.authEmail = e.target.value;
            },
          });

          const pwInput = el("input", {
            type: "password",
            class: "auth-input",
            placeholder: "Password",
            autocomplete: isRegister ? "new-password" : "current-password",
            required: true,
          });

          const inviteInput = el("input", {
            type: "text",
            class: "auth-input mono",
            value: state.authInvite,
            placeholder: "Invite Token (optionnel)",
            onInput: (e) => {
              state.authInvite = e.target.value;
            },
          });

          const form = el("form", {
            onSubmit: (e) => {
              e.preventDefault();
              const pw = pwInput.value;
              pwInput.value = "";
              if (!pw) return;
              void runSafe(async () => {
                if (isRegister) {
                  await ipc("cmd_register", {
                    serverUrl: state.authServerUrl.trim(),
                    email: state.authEmail.trim(),
                    masterPassword: pw,
                    inviteToken: state.authInvite.trim() || null,
                  });
                } else {
                  await ipc("cmd_login", {
                    serverUrl: state.authServerUrl.trim(),
                    email: state.authEmail.trim(),
                    masterPassword: pw,
                  });
                }
                await refreshAll();
              });
            },
          });

          const urlWrap = el("div", { class: "auth-field-wrap" }, [urlInput]);
          if (DEFAULT_SERVER_URL) {
            urlWrap.appendChild(
              el("button", {
                type: "button",
                class: "auth-inline-chip",
                title: `Remplir avec le serveur local (${DEFAULT_SERVER_URL})`,

                onClick: () => {
                  state.authServerUrl = DEFAULT_SERVER_URL;
                  urlInput.value = DEFAULT_SERVER_URL;
                  emailInput.focus();
                },
              }),
            );
          }

          form.appendChild(urlWrap);
          form.appendChild(el("div", { class: "auth-field-wrap" }, [emailInput]));
          form.appendChild(el("div", { class: "auth-field-wrap" }, [pwInput]));
          if (isRegister) {

          }

          form.appendChild(
            el("button", {
              type: "submit",
              class: "primary auth-submit",
              disabled: state.busy,
              text: state.busy ? "Connexion..." : isRegister ? "SignIn" : "Login",

          );

          card.appendChild(form);

            el("div", { class: "auth-footer-link" }, [

              el("button", {

                disabled: state.busy,
                text: isRegister ? "Login" : "SignIn",
                onClick: () => {

                  state.authMode = isRegister ? "login" : "register";
                  render();
                },
              }),
            ]),
          );

          return el("div", { class: "auth-stage" }, [card]);
        }

            const summary = state.items.find((i) => i.id === item.id);

          }

          const folderObj = state.folders.find((fl) => fl.id === item.folder_id);
          const metaLine = `${item.kind === "login" ? "Connexion" : "Note sécurisée"} · v${item.item_version}${
            folderObj ? ` · ${folderObj.name}` : ""
          }${item.trashed_at ? " · Dans la corbeille" : ""}`;

          const logoInput = el("input", {
            type: "file",

            onChange: async (e) => {

              e.target.value = "";

              if (file.size > MAX_AVATAR_BYTES) {
                state.error = "L'image sélectionnée dépasse la taille maximale de 5 Mo.";
                render();
                return;
              }
              const buf = await file.arrayBuffer();
              const u8 = new Uint8Array(buf);
              if (!hasValidImageMagicBytes(u8)) {
                state.error = "Fichier refusé : seule une image PNG, JPEG ou WebP valide est acceptée.";
                render();
                return;
              }
              void runSafe(async () => {
                const updated = await ipc("cmd_upload_item_logo", { itemId: item.id, bytes: Array.from(u8) });

                await refreshAll(updated.id);

                  state.error = "La photo dépasse la taille maximale de 5 Mo.";

                  return;

                  state.error = "Format invalide : uniquement PNG, JPEG ou WebP.";
                  render();
                  return;

                const buf = await file.arrayBuffer();
                const u8 = new Uint8Array(buf);
                if (!hasValidImageMagicBytes(u8)) {
                  state.error = "Image rejetée par sécurité : signature binaire PNG/JPEG/WebP invalide.";
                  render();
                  return;

                void runSafe(async () => {

                class: "ghost",
                style: { padding: "2px 6px" },
                text: "+",
                onClick: () => {
                  state.showAddFolder = !state.showAddFolder;
                  render();
                },
              }),
            ]),
          );

          if (state.showAddFolder) {
            const folderInput = el("input", { type: "text", placeholder: "Nom du dossier" });
            sidebar.appendChild(
              el("form", {
                style: { display: "flex", gap: "6px", marginBottom: "8px" },
                onSubmit: (e) => {
                  e.preventDefault();
                  const name = folderInput.value.trim();
                  if (!name) return;
                  void runSafe(async () => {
                    await ipc("cmd_save_folder", { id: null, name });
                    state.showAddFolder = false;
                    await refreshAll();
                  });
                },
              }, [folderInput, el("button", { type: "submit", class: "primary", text: "OK" })]),
            );
          }

          state.folders.forEach((folder) => {
            const active = state.navFilter.kind === "folder" && state.navFilter.folderId === folder.id;
            sidebar.appendChild(
              el("div", { class: "folder-row" }, [
                el("button", {
                  type: "button",
                  class: `nav-btn ${active ? "active" : ""}`,
                  text: folder.name,
                  onClick: () => {
                    state.navFilter = { kind: "folder", folderId: folder.id };
                    void runSafe(refreshAll);
                  },
                }),
                el("button", {
                  type: "button",
                  class: "ghost folder-del",
                  text: "×",
                  title: "Supprimer ce dossier",
                  onClick: () =>
                    void runSafe(async () => {
                      await ipc("cmd_delete_folder", { id: folder.id });
                      if (state.navFilter.folderId === folder.id) {
                        state.navFilter = { kind: "all", folderId: null };
                      }
                      await refreshAll();
                    }),
                }),
              ]),
            );
          });

          const chipAvatar = el("div", { class: "account-chip-avatar" });
          if (state.status.avatar_data_url) {
            chipAvatar.appendChild(el("img", { src: state.status.avatar_data_url, alt: "Avatar" }));
          } else {
            chipAvatar.textContent = (state.status.email || "A").slice(0, 2).toUpperCase();
          }

          const footer = el("div", { class: "sidebar-footer" }, [
            el("div", { class: "account-chip" }, [
              chipAvatar,
              el("div", { style: { minWidth: 0, flex: 1 } }, [
                el("div", {
                  style: {
                    fontWeight: 600,
                    color: "var(--text-primary)",
                    whiteSpace: "nowrap",
                    overflow: "hidden",
                    textOverflow: "ellipsis",
                  },
                  text: state.status.email || "Hors-ligne",
                }),
                el("div", { style: { display: "flex", alignItems: "center", gap: "6px", marginTop: "3px" } }, [
                  roleBadgeEl(state.status.role),
                  el("span", { style: { fontSize: "11px", color: "var(--text-muted)" }, text: `r${state.status.sync_revision}` }),
                ]),
              ]),
            ]),
            el("button", {
              type: "button",
              style: { width: "100%", fontSize: "12px" },
              text: "Mon Compte & Photo",
              onClick: () => {
                state.accountTab = "profile";
                state.modal = "account";
                render();
              },
            }),
          ]);
          sidebar.appendChild(footer);

          const visibleItems =
            state.kindFilter === "all"
              ? state.items
              : state.items.filter((i) => i.kind === state.kindFilter);

          const listPane = el("section", { class: "list-pane" }, [
            el("div", { class: "list-header" }, [
              el("span", { class: "list-count", text: `${visibleItems.length} fiche(s)` }),
              el("div", { class: "kind-pills" }, [
                ["all", "Tout"],
                ["login", "Connexions"],
                ["secure_note", "Notes"],
              ].map(([k, lbl]) =>
                el("button", {
                  type: "button",
                  class: `kind-pill ${state.kindFilter === k ? "active" : ""}`,
                  text: lbl,
                  onClick: () => {
                    state.kindFilter = k;
                    render();
                  },
                }),
              )),
            ]),
          ]);
          if (!visibleItems.length) {
            listPane.appendChild(
              el("div", { class: "empty-state", text: state.searchQuery ? "Aucun résultat." : "Coffre vide." }),
            );
          } else {
            visibleItems.forEach((item) => {
              const active = item.id === state.selectedItemId && !state.editing;
              const av = el("div", { class: "avatar", style: { background: item.fallback_color || "#7C6DFA" }, text: item.fallback_initials });
              listPane.appendChild(
                el("div", {
                  role: "button",
                  tabindex: "0",
                  class: `item-row ${active ? "active" : ""}`,
                  onClick: () => void runSafe(() => selectItem(item.id)),
                  onKeydown: (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                      e.preventDefault();
                      void runSafe(() => selectItem(item.id));
                    }
                  },
                }, [
                  av,
                  el("div", { class: "item-meta" }, [
                    el("div", { class: "item-title", text: `${item.favorite ? "★ " : ""}${item.title}` }),
                    el("div", { class: "item-sub", text: item.subtitle || "—" }),
                  ]),
                  item.has_totp ? el("span", { class: "pill totp", text: "2FA" }) : null,
                  item.kind === "login"
                    ? el("button", {
                        type: "button",
                        class: "quick-copy-btn",
                        title: "Copier le mot de passe",
                        text: "MDP",
                        onClick: (e) => {
                          e.stopPropagation();
                          void runSafe(async () => {
                            const detail = await ipc("cmd_get_item", { id: item.id });
                            if (detail?.login?.password) {
                              state.toast = await ipc("cmd_copy_secret", {
                                label: "Mot de passe",
                                value: detail.login.password,
                              });
                            }
                          });
                        },
                      })
                    : null,
                ]),
              );
            });
          }

          const detailPane = el("main", { class: "detail-pane" }, [renderDetail()]);
          return el("div", { class: "workspace" }, [sidebar, listPane, detailPane]);
        }

        function renderWorkspaceBar() {
          const searchInput = el("input", {
            id: "global-search",
            type: "search",
            value: state.searchQuery,
            placeholder: "Rechercher dans le coffre...",
            onInput: (e) => {
              state.searchQuery = e.target.value;
              void refreshAll().then(render);
            },
          });

          return el("div", { class: "workspace-bar" }, [
            el("div", { class: "search-wrap" }, [searchInput, el("span", { class: "kbd-hint", text: "Ctrl+K" })]),
            el("div", { class: "topbar-actions" }, [
              el("button", {
                type: "button",
                class: "primary",
                text: "+ Nouvelle fiche",
                onClick: () => beginEdit(null),
              }),
              el("button", {
                type: "button",
                text: "Générateur",
                onClick: () => {
                  state.modal = "generator";
                  void generatePreview();
                },
              }),
              el("button", {
                type: "button",
                text: "Import / Export",
                onClick: () => {
                  state.modal = "import";
                  render();
                },
              }),
              el("button", {
                type: "button",
                text: "Compte",
                onClick: () => {
                  state.accountTab = "profile";
                  state.modal = "account";
                  render();
                },
              }),
              state.status.pending_conflicts > 0
                ? el("button", {
                    type: "button",
                    class: "danger",
                    text: `Conflits (${state.status.pending_conflicts})`,
                    onClick: () => {
                      state.modal = "conflicts";
                      render();
                    },
                  })
                : null,
              el("button", {
                type: "button",
                disabled: state.syncing || state.busy,
                text: state.syncing ? "Synchro..." : `Synchroniser (r${state.status.sync_revision})`,
                onClick: () =>
                  void runSafe(async () => {
                    state.syncing = true;
                    render();
                    try {
                      await ipc("cmd_sync");
                      await refreshAll();
                    } finally {
                      state.syncing = false;
                    }
                  }),
              }),
              el("button", {
                type: "button",
                text: "Verrouiller",
                onClick: () =>
                  void runSafe(async () => {
                    await ipc("cmd_lock");
                    await refreshAll();
                  }),
              }),
            ]),
          ]);
        }

        function render() {
          const root = document.getElementById("app");
          if (!root) return;
          const activeEl = document.activeElement;
          const wasSearchFocused = activeEl && activeEl.id === "global-search";
          const searchSelStart = wasSearchFocused ? activeEl.selectionStart : null;
          root.replaceChildren();

          appendResizeHandles(root);
          root.appendChild(renderTitlebar());

          if (state.status.unlocked) {
            root.appendChild(renderWorkspaceBar());
          }

          if (state.error) {
            root.appendChild(
              el("div", { class: "error-banner" }, [
                el("span", { text: state.error }),
                el("button", {
                  type: "button",
                  class: "ghost",
                  text: "Fermer",
                  onClick: () => {
                    state.error = null;
                    render();
                  },
                }),
              ]),
            );
          }

          root.appendChild(state.status.unlocked ? renderWorkspace() : renderAuthScreens());

          if (state.showLogoutConfirm) root.appendChild(renderLogoutConfirmModal());
          if (state.modal === "generator") root.appendChild(renderGeneratorModal());
          if (state.modal === "import") root.appendChild(renderImportExportModal());
          if (state.modal === "conflicts") root.appendChild(renderConflictsModal());
          if (state.modal === "account") root.appendChild(renderAccountModal());

          if (state.toast) {
            const rem = Math.max(0, Math.ceil((state.toast.expires_at_ms - Date.now()) / 1000));
            root.appendChild(
              el("div", { class: "toast" }, [
                el("div", { class: "field-row" }, [
                  el("span", { style: { fontWeight: 600 }, text: state.toast.label }),
                  el("span", { id: "clipboard-toast-sec", class: "mono", style: { color: "var(--accent)" }, text: `${rem} s` }),
                ]),
              ]),
            );
          }

          if (wasSearchFocused) {
            const restored = document.getElementById("global-search");
            if (restored) {
              restored.focus();
              if (typeof searchSelStart === "number") {
                restored.setSelectionRange(searchSelStart, searchSelStart);
              }
            }
          }
        }

        window.addEventListener("keydown", (e) => {
          if (e.ctrlKey && e.key.toLowerCase() === "k" && state.status.unlocked) {
            e.preventDefault();
            document.getElementById("global-search")?.focus();
          } else if (e.ctrlKey && e.key.toLowerCase() === "n" && state.status.unlocked) {
            e.preventDefault();
            beginEdit(null);
          } else if (e.ctrlKey && e.key.toLowerCase() === "l" && state.status.unlocked) {
            e.preventDefault();
            void runSafe(async () => {
              await ipc("cmd_lock");
              await refreshAll();
            });
          } else if (e.key === "Escape") {
            if (state.showLogoutConfirm) {
              state.showLogoutConfirm = false;
              render();
            } else if (state.modal) {
              state.modal = null;
              render();
            } else if (state.editing) {
              state.editing = false;
              render();
            }
          }
        });

        startToastCountdown();
        startTotpLoop();
        void runSafe(refreshAll);
      })();
    </script>
  </body>
</html>
