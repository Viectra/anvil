[package]
name = "anvil-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Anvil Desktop native backend host, Win32 integration, and IPC commands"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[[bin]]
name = "anvil-desktop"
path = "src/main.rs"

[[bin]]
name = "anvil"
path = "src/gui_main.rs"

[dependencies]
anvil-core = { path = "../../../crates/anvil-core" }
anvil-client-core = { path = "../../../crates/anvil-client-core" }
anvil-server = { path = "../../../crates/anvil-server" }
axum.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
tao = "0.37"
wry = "0.57"
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "Foundation",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"

[dev-dependencies]
http.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true
