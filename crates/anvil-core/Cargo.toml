[package]
name = "anvil-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-knowledge cryptography, vault models, TOTP, search, and import/export core for Anvil"

[lints]
workspace = true

[features]
default = ["media"]
media = ["dep:image"]

[dependencies]
aes.workspace = true
argon2.workspace = true
base64.workspace = true
cbc.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
csv.workspace = true
data-encoding.workspace = true
flate2.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
image = { workspace = true, optional = true }
nucleo-matcher.workspace = true
pbkdf2.workspace = true
psl.workspace = true
quick-xml.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
zip.workspace = true
zxcvbn.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "now", "wasmbind"] }
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.11", features = ["v4", "js", "serde"] }

[dev-dependencies]
proptest.workspace = true
