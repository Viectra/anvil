[workspace]
resolver = "2"
members = [
    "crates/anvil-core",
    "crates/anvil-server",
    "crates/anvil-client-core",
    "crates/anvil-wasm",
    "apps/desktop/src-tauri",
    "apps/mobile/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Viectra/anvil"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
aes = "0.8"
anyhow = "1.0"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1.10"
cbc = { version = "0.1", default-features = false, features = ["alloc", "block-padding"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "now", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
data-encoding = "2.6"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem", "zeroize"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
getrandom = { version = "0.2" }
hkdf = "0.12"
hmac = "0.12"
http = "1.2"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ipnet = "2.11"
jsonwebtoken = { version = "9.3", default-features = false, features = ["use_pem"] }
nucleo-matcher = "0.3"
pbkdf2 = { version = "0.12", default-features = false, features = ["simple"] }
proptest = "1.5"
psl = "2.1"
quick-xml = "0.37"
regex = { version = "1.11", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "sqlite", "migrate", "uuid", "chrono"] }
subtle = "2.6"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "set-header", "compression-gzip", "request-id", "propagate-header"] }
tower_governor = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
zxcvbn = "3.1"
