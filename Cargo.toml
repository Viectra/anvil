[workspace]
resolver = "2"
members = [
    "crates/anvil-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Viectra/anvil"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
aes = "0.8"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
cbc = { version = "0.1", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
csv = "1.3"
data-encoding = "2.6"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
getrandom = { version = "0.2" }
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
nucleo-matcher = "0.3"
pbkdf2 = { version = "0.12", default-features = false, features = ["simple"] }
proptest = "1.5"
psl = "2.1"
quick-xml = "0.37"
rand_core = "0.6"
regex = { version = "1.11", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
zxcvbn = "3.1"
